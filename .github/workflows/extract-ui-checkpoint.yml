name: Extract NEXORA UI checkpoint

"on":
  push:
    branches:
      - main
    paths:
      - ".github/workflows/extract-ui-checkpoint.yml"
      - "NEXORA-UI-PREVIEW-ROTATING-BACKGROUNDS(2).zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source archive
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract the UI checkpoint safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile

          archive = Path("NEXORA-UI-PREVIEW-ROTATING-BACKGROUNDS(2).zip")
          if not archive.is_file():
              raise SystemExit("UI checkpoint ZIP is missing from main.")
          output = Path("ui-checkpoint")
          output.mkdir(parents=True, exist_ok=True)
          files = []
          skipped = []
          total = 0
          max_file = 80 * 1024 * 1024
          max_total = 500 * 1024 * 1024

          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit("ZIP integrity check failed: " + bad)
              for entry in zf.infolist():
                  name = PurePosixPath(entry.filename)
                  if name.is_absolute() or ".." in name.parts or (name.parts and ":" in name.parts[0]):
                      skipped.append(entry.filename + " (unsafe path)")
                      continue
                  if any(part in {".git", "node_modules"} for part in name.parts):
                      skipped.append(entry.filename + " (excluded Git/dependency directory)")
                      continue
                  if entry.is_dir():
                      (output / Path(*name.parts)).mkdir(parents=True, exist_ok=True)
                      continue
                  if entry.file_size > max_file or total + entry.file_size > max_total:
                      skipped.append(entry.filename + " (extraction size limit)")
                      continue
                  target = (output / Path(*name.parts)).resolve()
                  root = output.resolve()
                  if target != root and root not in target.parents:
                      skipped.append(entry.filename + " (unsafe destination)")
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(entry) as src, target.open("wb") as dst:
                      count = 0
                      while True:
                          block = src.read(1024 * 1024)
                          if not block:
                              break
                          count += len(block)
                          if count > max_file:
                              raise SystemExit("Expanded file exceeds limit: " + entry.filename)
                          dst.write(block)
                  total += count
                  files.append((target.relative_to(root).as_posix(), count))

          if not files:
              raise SystemExit("No files extracted; archive layout needs inspection.")
          report = [
              "# NEXORA UI checkpoint extraction report",
              "",
              f"Extracted files: {len(files)}",
              f"Expanded bytes: {total}",
              f"Skipped entries: {len(skipped)}",
              "",
              "## Inventory",
              "",
          ]
          report.extend(f"- {path} ({size} bytes)" for path, size in sorted(files))
          if skipped:
              report.extend(["", "## Skipped", ""])
              report.extend("- " + item for item in skipped)
          (output / "EXTRACTION-REPORT.md").write_text("\n".join(report) + "\n", encoding="utf-8")
          print(f"Extracted {len(files)} files ({total} bytes).")
          PY

      - name: Upload extracted project for inspection
        uses: actions/upload-artifact@v4
        with:
          name: nexora-ui-checkpoint
          path: ui-checkpoint/
          if-no-files-found: error
          retention-days: 7
